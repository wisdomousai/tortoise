# Generated by `agent-native network export --format compose`. Do not edit; regenerate.
# Policy a874c563fd1c4591 (sandbox, connected). Default: deny all egress except loopback and the rules below.
# NOT ENFORCED: vendor-api (api.vendor.example) has no addresses in the site policy; it stays blocked here.
# NOT ENFORCED: Compose cannot filter egress by destination. Apply the nftables export on the
# host (or k8s-networkpolicy in a cluster); this file only hardens the container.
services:
  agent-native:
    image: "registry.plant.local/agent-native:1.0.0"
    command:
      - "serve"
      - "--workspace"
      - "/var/lib/agent-native/workspace"
      - "--audit-log"
      - "/var/lib/agent-native/audit"
      - "--site-policy"
      - "/etc/agent-native/site-policy.json"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:size=64m"
    volumes:
      - "agent-native-workspace:/var/lib/agent-native/workspace"
      - "agent-native-audit:/var/lib/agent-native/audit"
      - "./site-policy.json:/etc/agent-native/site-policy.json:ro"
    networks:
      - "agent-native-egress"
networks:
  agent-native-egress:
    driver: "bridge"
volumes:
  agent-native-workspace: {}
  agent-native-audit: {}
