# Generated by `tortoise network export --format compose`. Do not edit; regenerate.
# Policy 7325a6cdf090f465 (sandbox, connected). Default: deny all egress except loopback and the rules below.
# NOT ENFORCED: vendor-api (api.vendor.example) has no addresses in the site policy; it stays blocked here.
# NOT ENFORCED: Compose cannot filter egress by destination. Apply the nftables export on the
# host (or k8s-networkpolicy in a cluster); this file only hardens the container.
services:
  tortoise:
    image: "registry.plant.local/tortoise:1.0.0"
    command:
      - "serve"
      - "--workspace"
      - "/var/lib/tortoise/workspace"
      - "--audit-log"
      - "/var/lib/tortoise/audit"
      - "--site-policy"
      - "/etc/tortoise/site-policy.json"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:size=64m"
    volumes:
      - "tortoise-workspace:/var/lib/tortoise/workspace"
      - "tortoise-audit:/var/lib/tortoise/audit"
      - "./site-policy.json:/etc/tortoise/site-policy.json:ro"
    networks:
      - "tortoise-egress"
networks:
  tortoise-egress:
    driver: "bridge"
volumes:
  tortoise-workspace: {}
  tortoise-audit: {}
