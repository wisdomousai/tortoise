[project]
name = "agent-native-driver"
version = "0.1.0"
description = "Write agent-native hardware drivers in Python: JSON-RPC over stdio, mode gating, effect deduplication and contract stubs."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-native-driver-stubgen = "agent_native_driver.stubgen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_native_driver"]
